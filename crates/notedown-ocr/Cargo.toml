[package]
name = "notedown-ocr"
description = "OCR backend for notedown"
version.workspace = true
edition.workspace = true
license = "MPL-2.0"
repository.workspace = true
rust-version.workspace = true

[dependencies]
pagevision = { workspace = true, features = ["engine", "serde"] }
serde.workspace = true
sha2.workspace = true
const-hex.workspace = true
thiserror.workspace = true
dirs.workspace = true
reqwest.workspace = true
# Only so that the vulkan and cuda features can reach it; cargo unifies it with the copy
# inside pagevision, which turns on its backend features.
llama-cpp-2 = { version = "=0.1.161", default-features = false }

[dev-dependencies]
tempfile.workspace = true

[features]
vulkan = ["llama-cpp-2/vulkan"]
cuda = ["llama-cpp-2/cuda"]
