[workspace]
resolver = "3"
members = ["crates/notedown-note", "crates/notedown-ocr", "crates/notedown-cloud", "crates/notedown"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jordiboehme/notedown"
rust-version = "1.99"

[workspace.dependencies]
notedown-note = { path = "crates/notedown-note", version = "0.1.0" }
notedown-ocr = { path = "crates/notedown-ocr", version = "0.1.0" }
notedown-cloud = { path = "crates/notedown-cloud", version = "0.1.0" }
thiserror = "=2.0.21"
anyhow = "=1.0.104"
base64 = "=0.23.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
image = { version = "=0.25.10", default-features = false, features = ["png"] }
sha2 = "=0.11.0"
const-hex = "=1.19.3"
insta = "=1.49.0"
zip = { version = "=8.6.0", default-features = false, features = ["deflate"] }
scraper = "=0.27.0"
dirs = "=7.0.0"
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "rustls"] }
tempfile = "=3.27.0"
clap = { version = "=4.6.7", features = ["derive"] }
time = { version = "=0.3.55", features = ["formatting"] }
toml = "=1.1.6"
hmac = "=0.13.0"
md-5 = "=0.11.0"
rand = "=0.10.3"
subtle = "=2.6.1"
rpassword = "=7.5.4"
if-addrs = "=0.15.0"
axum = { version = "=0.8.9", features = ["ws", "multipart"] }
tokio = { version = "=1.53.2", features = ["net", "rt-multi-thread", "sync", "time", "signal"] }
tower-http = { version = "=0.7.1", features = ["catch-panic"] }
tower = { version = "=0.5.3", features = ["util"] }
tokio-tungstenite = "=0.30.0"
futures-util = { version = "=0.3.34", default-features = false, features = ["std", "sink"] }
unicode-normalization = "=0.1.25"
unicase = "=2.10.0"

# Lean debug builds: our own code keeps line tables (readable backtraces), dependencies carry no
# debug info. This keeps target/ small and links faster.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
