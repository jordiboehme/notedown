name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Read only by default: every job can check out the tree and nothing more. A
# job that needs another scope names it in its own `permissions:` block.
permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. A push to main
# keeps one group per commit and never cancels.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the Rust jobs run. They are skipped (reported as skipped,
  # not failed) when the change touches documentation only: root-level *.md,
  # docs/**, release-notes/**, LICENSE, NOTICE, .github/*.md,
  # .github/badges/**, .github/ISSUE_TEMPLATE/** and .github/FUNDING.yml.
  #
  # Everything else counts as code, including .github/workflows/** (a
  # workflow change has to exercise itself) and markdown deeper in the tree.
  #
  # The classifier fails safe: an unknown event, a missing or zeroed base, a
  # force push, a git error or an empty file list all set code=true. A
  # failed classifier skips the Rust jobs, and ci-passed reports the failure
  # of this job itself.
  #
  # The tested-tree skip: on a push to main, a pull request run that passed
  # every gated job on the same tree (the same files, so the same build) left
  # an artifact tested-tree-<tree> (see ci-passed). When it is found, the
  # gated jobs are skipped instead of running the same work a second time.
  # Any error, an empty answer or anything unclear leaves tested=false, and
  # the gates read `!= 'true'`, so a missing output runs everything.
  changes:
    name: changes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    # The artifact lookup needs actions: read. Naming one permission drops the
    # rest to none, so checkout's contents: read is named as well.
    permissions:
      contents: read
      actions: read
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
      tested: ${{ steps.tested.outputs.tested }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier diffs against a base commit, which the default
          # shallow clone does not have.
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          # The runner starts this shell with -e. Turn it off on purpose: every
          # failure in here has to end in code=true, never in a non-zero exit.
          set +e
          set -u

          run_everything() {
            echo "changes: $1, so every job runs."
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              # Three dots: what this side added since the merge base.
              base="$PR_BASE_SHA"
              range="${base}...HEAD"
              ;;
            push)
              if [ "$PUSH_FORCED" = "true" ]; then
                run_everything "a force push leaves no usable base"
              fi
              base="$PUSH_BEFORE_SHA"
              range="${base}..HEAD"
              ;;
            *)
              run_everything "the event $EVENT_NAME has no base to compare against"
              ;;
          esac

          case "$base" in
            '')             run_everything "there is no base commit" ;;
            *[!0-9a-fA-F]*) run_everything "the base is not a commit sha ($base)" ;;
            *[!0]*)         ;;
            *)              run_everything "the base commit is all zeros (a first push or a new branch)" ;;
          esac

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            run_everything "the base commit $base is not in this clone"
          fi

          # --no-renames so a file that moves shows up on both sides: a rename
          # out of code into docs must not read as a documentation change.
          if ! files=$(git diff --name-only --no-renames "$range"); then
            run_everything "git diff $range failed"
          fi
          if [ -z "$files" ]; then
            run_everything "the diff against $base is empty"
          fi

          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/workflows/*) verdict=code ;;
              docs/*|release-notes/*) verdict=docs ;;
              LICENSE|LICENSE.md|LICENSE.txt|NOTICE) verdict=docs ;;
              .github/badges/*|.github/ISSUE_TEMPLATE/*|.github/FUNDING.yml|.github/*.md) verdict=docs ;;
              */*)                 verdict=code ;;
              *.md)                verdict=docs ;;
              *)                   verdict=code ;;
            esac
            echo "  $verdict  $f"
            if [ "$verdict" = code ]; then
              code=true
            fi
          done <<<"$files"

          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "changes: code=$code"

      - name: Decide whether the Rust jobs run
        id: decide
        env:
          CODE: ${{ steps.classify.outputs.code }}
        run: |
          set -euo pipefail
          if [ "$CODE" = "false" ]; then
            echo "changes: documentation only, so the Rust jobs are skipped."
            echo "rust=false" >>"$GITHUB_OUTPUT"
          else
            echo "rust=true" >>"$GITHUB_OUTPUT"
          fi

      # Only artifacts of runs whose head is in this repository count: a fork's
      # pull request runs its own copy of this file and could upload any name.
      # A branch of this repository was pushed by someone with write access,
      # who could change this file anyway.
      - name: Look for a green pull request run of this tree
        id: tested
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REPO_ID: ${{ github.repository_id }}
        run: |
          # As in the classifier: every failure in here has to end in
          # tested=false and exit 0, never in a red job.
          set +e
          set -u

          run_the_tests() {
            echo "tested: $1, so the gated jobs run."
            echo "tested=false" >>"$GITHUB_OUTPUT"
            exit 0
          }

          case "$REPO_ID" in
            ''|*[!0-9]*) run_the_tests "the repository id '$REPO_ID' is not a number" ;;
          esac

          if ! tree=$(git rev-parse 'HEAD^{tree}'); then
            run_the_tests "git could not name the tree of HEAD"
          fi
          case "$tree" in
            ''|*[!0-9a-f]*) run_the_tests "'$tree' is not a tree sha" ;;
          esac

          name="tested-tree-$tree"
          echo "tested: looking for the artifact $name"
          if ! runs=$(gh api "repos/$REPO/actions/artifacts?name=$name&per_page=100" \
            --jq "[.artifacts[] | select(.name == \"$name\" and .expired == false and .workflow_run.repository_id == $REPO_ID and .workflow_run.head_repository_id == $REPO_ID) | .workflow_run.id] | unique | map(tostring) | join(\" \")"); then
            run_the_tests "the artifact lookup for $name failed"
          fi
          if [ -z "$runs" ]; then
            # The usual reason: main moved while the pull request was open
            # and it merged without being brought up to date, so the merge
            # commit's tree is one no pull request run has seen.
            echo "::notice title=tree skip missed::no green pull request run of the tree $tree (no unexpired $name). Likely the pull request was not up to date with main when it merged, so the gated jobs run again here."
            run_the_tests "no pull request run of this repository left an unexpired $name"
          fi

          echo "tested: the pull request run(s) $runs passed every gated job on the tree $tree, so the gated jobs are skipped."
          echo "tested=true" >>"$GITHUB_OUTPUT"

  fmt:
    name: fmt
    timeout-minutes: 10
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the version and the components.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # A cold cache builds llama.cpp from C++ first, which takes most of the
  # time on these two jobs.
  clippy:
    name: clippy (${{ matrix.os }})
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # notedown-ocr builds llama.cpp with cmake and a C++ compiler, and
      # bindgen needs libclang. On Linux it links OpenMP (libgomp). The
      # runner images already have all of it (macOS: Xcode and cmake), so
      # nothing is installed. This step only checks the Linux tools, so an
      # image change fails here with a clear message and not deep in the
      # llama.cpp build.
      - name: Check the C++ build tools
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          cmake --version | head -n 1
          c++ --version | head -n 1
          # gcc prints the bare name when it does not find the library.
          gomp="$(gcc -print-file-name=libgomp.so)"
          echo "libgomp: $gomp"
          test -e "$gomp"

      # Only main saves the cache, so a pull request cannot plant artifacts
      # that a later run on main would restore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --locked: Cargo.lock is the input, and a lockfile that would need an
      # update fails the check instead of being re-resolved on the runner.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 60
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # The same check as in clippy.
      - name: Check the C++ build tools
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          cmake --version | head -n 1
          c++ --version | head -n 1
          # gcc prints the bare name when it does not find the library.
          gomp="$(gcc -print-file-name=libgomp.so)"
          echo "libgomp: $gomp"
          test -e "$gomp"

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.148
          fallback: none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --no-tests=warn: a workspace whose crates have no tests yet is not an
      # error.
      - name: cargo nextest run
        run: cargo nextest run --workspace --locked --no-tests=warn

      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --workspace --doc --locked

  # Linux on arm64, the Raspberry Pi. This job is the spec's Pi build check:
  # the notedown binary without its `ocr` feature (no llama.cpp) is built,
  # linted and tested here, and the dependency tree must not contain OCR.
  pi:
    name: pi (arm64)
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.148
          fallback: none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pi
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build -p notedown-cloud
        run: cargo build -p notedown-cloud --locked

      - name: cargo nextest run -p notedown-cloud
        run: cargo nextest run -p notedown-cloud --locked --no-tests=warn

      - name: cargo test --doc -p notedown-cloud
        run: cargo test -p notedown-cloud --doc --locked

      - name: cargo clippy -p notedown --no-default-features
        run: cargo clippy -p notedown --no-default-features --all-targets --locked -- -D warnings

      - name: cargo nextest run -p notedown --no-default-features
        run: cargo nextest run -p notedown --no-default-features --locked --no-tests=warn

      - name: The Pi build has no OCR in its dependency tree
        run: |
          tree="$(cargo tree --locked --target aarch64-unknown-linux-gnu -p notedown --no-default-features -e normal)"
          if test -z "$tree"; then
            echo "cargo tree printed nothing, so the check proves nothing"
            exit 1
          fi
          if printf '%s\n' "$tree" | grep -E 'llama-cpp|notedown-ocr|notedown-pipeline|notedown-convert'; then
            echo "the Pi build pulls in OCR"
            exit 1
          fi

  # The Linux release build: a static musl binary of notedown without its
  # `ocr` feature, for amd64 and arm64, each on a native runner (the release
  # builds the same way). Checks that the binary is static and that
  # --version names the workspace version. The amd64 binary is uploaded as
  # the artifact musl-amd64 for the .deb and image smoke tests (upload-artifact
  # does not keep the exec bit, so a user of it runs chmod first).
  musl:
    name: musl (${{ matrix.arch }})
    timeout-minutes: 30
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {arch: amd64, os: ubuntu-latest, target: x86_64-unknown-linux-musl}
          - {arch: arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    # The matrix reaches the shell steps as environment variables, never as
    # `${{ }}` text pasted into a script.
    env:
      LEG_TARGET: ${{ matrix.target }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          bash scripts/ci/retry.sh 3 rustup toolchain install
          rustup show active-toolchain

      - name: Add the musl target
        run: bash scripts/ci/retry.sh 3 rustup target add "$LEG_TARGET"

      # aws-lc-sys (rustls) is C and needs the musl C compiler.
      - name: Install musl-tools
        run: |
          bash scripts/ci/retry.sh 3 sudo apt-get update
          bash scripts/ci/retry.sh 3 sudo apt-get install -y musl-tools

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: musl-${{ matrix.arch }}
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build --release --target musl -p notedown --no-default-features
        run: cargo build --release --locked --target "$LEG_TARGET" -p notedown --no-default-features

      - name: The binary is static and names the workspace version
        run: |
          set -euo pipefail
          bin="target/$LEG_TARGET/release/notedown"
          info="$(file -b "$bin")"
          echo "file: $info"
          # Rust's musl targets link static-pie, which file reports as
          # "static-pie linked"; older file versions say "statically linked".
          if ! grep -qE 'static(ally|-pie) linked' <<<"$info" \
            || grep -qE 'dynamically linked|interpreter' <<<"$info"; then
            echo "::error::$bin is not a static binary"
            exit 1
          fi
          version="$(awk '
            /^\[/ { inside = ($0 ~ /^\[workspace\.package\][[:space:]]*$/) ; next }
            inside && /^version[[:space:]]*=/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
            }' Cargo.toml)"
          got="$("$bin" --version)"
          echo "--version: $got"
          if [ "$got" != "notedown $version" ]; then
            echo "::error::$bin --version printed '$got', want 'notedown $version'"
            exit 1
          fi

      - name: Upload the amd64 binary
        if: ${{ matrix.arch == 'amd64' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: musl-amd64
          path: target/x86_64-unknown-linux-musl/release/notedown
          retention-days: 3
          overwrite: true
          if-no-files-found: error

  # Dependency audit: advisories (RustSec), licenses (the allowlist in
  # deny.toml), sources and bans. security.yml also checks advisories every
  # week, since a new advisory appears without any change here.
  cargo-deny:
    name: cargo-deny
    timeout-minutes: 15
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The rust-toolchain.toml pin, so the action's container does not
          # resolve a different toolchain. Dependabot does not update this
          # value: move it together with rust-toolchain.toml.
          rust-version: '1.99.0'
          # `check` without a list runs all four: advisories, bans,
          # licenses and sources.
          command: check
          arguments: --all-features --locked

      # The Mac app is its own workspace with its own Cargo.lock and
      # deny.toml (next to its manifest). Its deny.toml checks the macOS
      # targets only.
      - name: cargo-deny for the Mac app
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          rust-version: '1.99.0'
          manifest-path: app/src-tauri/Cargo.toml
          command: check
          arguments: --all-features --locked

  # The Mac app in app/: its frontend checks and its own Cargo workspace in
  # app/src-tauri. The root workspace jobs do not see it. tauri-build needs
  # the sidecar file to exist, so a stub stands in for the notedown program
  # (building it would build llama.cpp). generate_context! needs ../dist, so
  # the frontend is built first.
  app:
    name: app
    timeout-minutes: 45
    needs: changes
    if: ${{ !cancelled() && needs.changes.outputs.rust == 'true' && needs.changes.outputs.tested != 'true' }}
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: app/package-lock.json

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: app/src-tauri -> target
          shared-key: app
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: npm ci
        run: npm ci
        working-directory: app

      - name: npm run check
        run: npm run check
        working-directory: app

      - name: vitest
        run: npx vitest run
        working-directory: app

      - name: npm run build
        run: npm run build
        working-directory: app

      - name: Stub sidecar
        working-directory: app/src-tauri
        run: |
          set -euo pipefail
          triple="$(rustc -vV | sed -n 's/host: //p')"
          mkdir -p binaries
          printf '#!/bin/sh\nexit 0\n' >"binaries/notedown-$triple"
          chmod 755 "binaries/notedown-$triple"
          # tauri-build also needs the notices resource of tauri.conf.json.
          mkdir -p resources
          printf 'Placeholder of a CI build.\n' >resources/THIRD-PARTY-NOTICES.txt

      - name: cargo fmt --check
        run: cargo fmt --check
        working-directory: app/src-tauri

      - name: cargo clippy
        run: cargo clippy --all-targets --locked -- -D warnings
        working-directory: app/src-tauri

      - name: cargo test
        run: cargo test --locked
        working-directory: app/src-tauri

  # Static checks of the workflows. actionlint catches expression, type and
  # shell errors; zizmor catches the security mistakes (template injection,
  # over-wide tokens, persisted credentials, unpinned or impostor actions).
  # zizmor fails the job inline instead of uploading SARIF, so the job needs
  # no write scope. An accepted finding is ignored with a
  # `# zizmor: ignore[...]` comment next to its line and a reason above it.
  # Runs on every change, documentation included: it needs no Rust toolchain.
  workflow-lint:
    name: workflow-lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint 1.7.12 (the image digest is in the action's settings.json).
      - name: actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

      # The fixture tests of the CI and release scripts (jq and git are on
      # the runner image).
      - name: Script tests
        run: |
          set -euo pipefail
          bash scripts/ci/test-release-check.sh
          bash scripts/ci/test-version-pins.sh
          bash scripts/ci/test-jobs-passed.sh
          bash scripts/ci/test-notices.sh

      # Every place that names the version names the same one, so a version
      # bump that left a pin behind fails its pull request.
      - name: Version pins
        run: bash scripts/ci/version-pins.sh

      # A release pull request learns here, not after its merge, when its
      # notes file has no H1. Without a notes file this needs no network.
      - name: Release check
        run: bash scripts/release-check.sh

  # The one check a branch protection rule requires. It always runs and
  # passes when every job above passed or was skipped (a documentation-only
  # change, or a main push whose tree a pull request run tested). Any
  # failure or cancellation fails it. A job `if` without always() would skip
  # this job when a need is skipped, and a skipped required check is not a
  # reliable signal.
  #
  # Two checks. The first reads the needs results. The second reads every
  # leg of the run from the API: a matrix job's result in `needs` sums up its
  # legs, and a leg that was cancelled or timed out must fail this check too.
  # Only completed jobs are judged, since the release jobs that wait for this
  # one are still queued.
  #
  # On a pull request where no need was skipped it then uploads the proof
  # tested-tree-<tree>, which lets the push to main skip the gated jobs on
  # the same tree (see changes).
  ci-passed:
    name: ci-passed
    timeout-minutes: 10
    needs: [changes, fmt, clippy, test, pi, musl, cargo-deny, app, workflow-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    # actions: read for the jobs list of this run.
    permissions:
      contents: read
      actions: read
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          set -euo pipefail
          bad=$(jq -r 'to_entries[] | select(.value.result != "success" and .value.result != "skipped") | "\(.key): \(.value.result)"' <<<"$RESULTS")
          jq -r 'to_entries[] | "  \(.value.result)  \(.key)"' <<<"$RESULTS"
          if [ -n "$bad" ]; then
            echo "::error::not every job passed: $(tr '\n' ' ' <<<"$bad")"
            exit 1
          fi
          echo "ci-passed: every job passed or was skipped"

      # The commit every job above checked out: refs/pull/N/merge at
      # github.sha on a pull request, the pushed commit on main.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Every leg passed or was skipped
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          jobs="$RUNNER_TEMP/jobs.json"
          # The redirect sits inside the retried command, so a failed try
          # leaves no partial output behind.
          bash scripts/ci/retry.sh 3 bash -c \
            'gh api "repos/$REPO/actions/runs/$RUN_ID/jobs?filter=latest&per_page=100" --paginate >"$1"' \
            _ "$jobs"
          bash scripts/ci/jobs-passed.sh <"$jobs"

      - name: Name the tested tree
        id: tree
        if: ${{ github.event_name == 'pull_request' && !contains(needs.*.result, 'skipped') }}
        run: |
          set -euo pipefail
          tree=$(git rev-parse 'HEAD^{tree}')
          echo "ci-passed: every gated job passed on the tree $tree (commit $GITHUB_SHA)"
          echo "tree=$tree" >>"$GITHUB_OUTPUT"
          mkdir -p "$RUNNER_TEMP/tested-tree"
          printf 'tree %s\ncommit %s\nrun %s\n' "$tree" "$GITHUB_SHA" "$GITHUB_RUN_ID" \
            >"$RUNNER_TEMP/tested-tree/tested-tree.txt"

      # A re-run of this job uploads the same name again, hence overwrite.
      - name: Upload the proof
        if: ${{ github.event_name == 'pull_request' && !contains(needs.*.result, 'skipped') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tested-tree-${{ steps.tree.outputs.tree }}
          path: ${{ runner.temp }}/tested-tree/tested-tree.txt
          retention-days: 7
          overwrite: true
          if-no-files-found: error
