[package]
name = "notedown-app"
description = "The Notedown menu bar app for macOS"
version = "0.1.0"
edition = "2024"
rust-version = "1.99"
license = "AGPL-3.0-or-later"
repository = "https://github.com/jordiboehme/notedown"
publish = false

# Its own workspace, with its own Cargo.lock and deny.toml: the Tauri tree stays out of the
# CLI's workspace, its lock file and its dependency audit.
[workspace]

# Named apart from the binary (main.rs), so the two targets do not clash.
[lib]
name = "notedown_app_lib"

[build-dependencies]
tauri-build = { version = "=2.7.4", features = [] }

[dependencies]
# tray-icon: the menu bar icon; image-png: its template PNGs.
tauri = { version = "=2.12.5", features = ["tray-icon", "image-png"] }
# A second launch opens the panel of the running app instead of starting a second one.
tauri-plugin-single-instance = "=2.5.5"
# "Start at login" on the General page, as a LaunchAgent. Off until the user turns it on.
tauri-plugin-autostart = "=2.7.0"
# The folder picker of the Markdown folder on the OCR page. Only the settings window may open it
# (capabilities/settings.json).
tauri-plugin-dialog = "=2.8.4"
# The self-updater: checks GitHub's latest.json, verifies the minisign signature of the update
# and installs it. Only Rust calls it (update.rs); no window has its permissions. native-tls as
# the app's reqwest, so no second TLS stack; the macOS .app.tar.gz needs no `zip` feature.
tauri-plugin-updater = { version = "=2.14.1", default-features = false, features = ["native-tls"] }
# Compares a found version with the one About opened for last. Already in the tree through Tauri.
semver = "=1.0.28"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.154"
# The token lives in the macOS Keychain; without apple-native keyring can fall back to a mock.
keyring = { version = "=3.6.3", default-features = false, features = ["apple-native"] }
# Signals to process groups (killpg) for the supervised children.
libc = "=0.2.191"
# GET /account on the server, from the poller's own threads (so blocking); macOS TLS for a
# remote server behind HTTPS.
reqwest = { version = "=0.13.5", default-features = false, features = ["blocking", "native-tls"] }
# The login proves the password with sha256_hex(md5_hex(password) + code), as the device does.
md-5 = "=0.11.0"
sha2 = "=0.11.1"
# Reads the `listen` port from the server's `server.toml`.
toml = "=1.2.1"
# Names the user types (a new folder, a rename, a restore) are sent in NFC, as the server keeps them.
unicode-normalization = "=0.1.26"
# Uploads stream a file as the body of one PUT on a runtime of the upload's own thread, so a
# cancel or a stalled connection drops the request (the blocking client cannot be stopped while
# it waits for the socket). All three are in the tree through reqwest already.
tokio = { version = "=1.54.1", default-features = false, features = ["rt", "time"] }
http-body = "=1.1.0"
bytes = "=1.12.1"

# The review gets each page image as a `data:image/png;base64,...` URL. Already in the tree
# through Tauri.
base64 = "=0.23.1"

# Desktop notifications through UNUserNotificationCenter (notify/macos.rs): a real permission
# request and state, a fixed request id per kind that replaces the shown notice, and clicks
# through a delegate. All four are in the tree through Tauri already; only the features used
# are turned on (the defaults of the framework crates turn on every module).
objc2 = "=0.6.5"
# The completion handlers of the notification center are Objective-C blocks.
block2 = "=0.6.2"
# NSString, NSDictionary and the other Foundation types the notification API takes.
objc2-foundation = { version = "=0.3.2", default-features = false, features = ["std", "NSString", "NSDictionary", "NSError", "NSSet", "NSBundle", "NSObject", "NSCalendar", "NSDate"] }
# The UserNotifications framework.
objc2-user-notifications = { version = "=0.3.2", default-features = false, features = ["std", "block2", "UNUserNotificationCenter", "UNNotification", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationSettings", "UNNotificationTrigger"] }

[dev-dependencies]
tempfile = "=3.27.0"

# Lean debug builds, as in the root workspace.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
