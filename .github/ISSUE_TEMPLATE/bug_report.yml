name: Bug report
description: Something does not work as described.
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please don't attach notes with private content. For a security problem, read [SECURITY.md](https://github.com/jordiboehme/notedown/blob/main/SECURITY.md) instead.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What did you do, what did you expect and what happened instead?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The commands you ran and their output.
      render: shell
  - type: input
    id: version
    attributes:
      label: notedown version
      description: The output of `notedown --version`.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: System
      description: For example macOS 26 on Apple silicon or Ubuntu 24.04 on x86_64.
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Supernote device and firmware
      description: Only if the problem involves the device or the sync.
