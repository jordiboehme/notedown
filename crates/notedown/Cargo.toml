[package]
name = "notedown"
description = "Turn Supernote handwritten notes into Markdown"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "notedown"
path = "src/main.rs"

[package.metadata.deb]
maintainer = "Jordi Böhme <jordi@boehme-lopez.de>"
copyright = "2026, Jordi Böhme <jordi@boehme-lopez.de>"
license-file = "../../LICENSE"
section = "utils"
priority = "optional"
# Static musl binary: no shared-library dependencies to detect, so no "$auto".
# The postinst cargo-deb writes calls systemd-sysusers, which comes with systemd
# or as the standalone systemd-sysusers package.
depends = "systemd | systemd-sysusers"
extended-description = """
Notedown turns Supernote handwritten notes into Markdown. This Linux build \
has the sync server your Supernote talks to and the other tools, without \
OCR. It installs a notedown system user and a systemd unit that is not \
enabled or started."""
# The units dir defaults to this folder. cargo-deb 3.8.0 installs from it:
# notedown.service to usr/lib/systemd/system/, notedown.tmpfile to
# usr/lib/tmpfiles.d/notedown.conf and notedown.sysusers to
# usr/lib/sysusers.d/notedown.conf. There is no postinst here: cargo-deb
# writes the maintainer scripts itself (systemd-sysusers, then
# systemd-tmpfiles, then the unit lines).
maintainer-scripts = "debian/"
# dist/THIRD-PARTY-NOTICES.txt (workspace root) is the Linux notices file. The
# release stages it there before cargo deb; the CI smoke writes a placeholder.
assets = [
    ["target/release/notedown", "usr/bin/", "755"],
    ["../../README.md", "usr/share/doc/notedown/README.md", "644"],
    ["../../LICENSE", "usr/share/doc/notedown/LICENSE", "644"],
    ["../../NOTICE", "usr/share/doc/notedown/NOTICE", "644"],
    ["../../dist/THIRD-PARTY-NOTICES.txt", "usr/share/doc/notedown/THIRD-PARTY-NOTICES.txt", "644"],
    ["debian/notedown.default", "etc/default/notedown", "644"],
]

# The unit ships installed but disabled: enable = false leaves activation to
# the admin (systemctl enable --now notedown) and start = false never starts
# it on install. restart-after-upgrade stays true on purpose: with
# start = false cargo-deb emits a try-restart guarded by "upgrade only", so a
# unit the admin runs is restarted onto the new binary and a disabled unit is
# never touched.
[package.metadata.deb.systemd-units]
enable = false
start = false
restart-after-upgrade = true

[features]
# The OCR side: convert, model, pipeline and mcp. Without it the binary is the sync server
# and the other tools, with no llama.cpp (the Raspberry Pi build).
default = ["ocr"]
ocr = ["dep:notedown-ocr", "dep:notedown-pipeline", "dep:notedown-convert"]

[dependencies]
clap.workspace = true
anyhow.workspace = true
serde_json.workspace = true
zip.workspace = true
time.workspace = true
notedown-note.workspace = true
notedown-ocr = { workspace = true, optional = true }
notedown-cloud.workspace = true
notedown-convert = { workspace = true, optional = true }
notedown-pipeline = { workspace = true, optional = true }
rpassword.workspace = true
if-addrs.workspace = true
tokio.workspace = true

[dev-dependencies]
tempfile.workspace = true
zip.workspace = true
sha2.workspace = true
const-hex.workspace = true
