[package]
name = "notedown-mcp-http"
description = "The notedown MCP tools over HTTP, with OAuth and the notedown accounts"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
anyhow.workspace = true
axum.workspace = true
base64.workspace = true
const-hex.workspace = true
notedown-cloud.workspace = true
notedown-pipeline.workspace = true
rand.workspace = true
rmcp = { workspace = true, features = ["transport-streamable-http-server", "transport-streamable-http-server-session"] }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true
time.workspace = true
tokio.workspace = true
tower.workspace = true

[dev-dependencies]
futures-util.workspace = true
reqwest = { workspace = true, features = ["form", "query", "json"] }
rmcp = { workspace = true, features = ["client", "transport-streamable-http-client-reqwest"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["macros"] }
