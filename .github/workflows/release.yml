name: Release

# Three ways in, one release tag. The `notes` job resolves it once and every
# later job reads its outputs, never the ref:
#
# - workflow_call: CI on main calls this after `ci-passed` when the workspace
#   version has a release notes file and no tag yet (scripts/release-check.sh).
#   The tag comes from the `tag` input; github.ref and github.event_name are
#   the caller's here (refs/heads/main, push), so they say nothing about the
#   release. publish creates the tag at the tested commit (github.sha).
#   release-rehearsal.yml calls this too, with `dry_run: true`: the call path
#   runs end to end and publishes nothing.
# - push of a `v*` tag: the fallback. The tag is the pushed ref.
# - workflow_dispatch: a dry run. It builds and packages everything under the
#   version 0.0.0-dev and publishes nothing, also when it is started on a tag
#   ref.
#
# Jobs: notes, notices, build-linux, sbom and build-macos (the CLI and the
# app, signed and notarized) here; collect (every asset checked, SHA256SUMS,
# latest.json, the Homebrew files) and publish, images and homebrew follow.
# Release jobs use no build cache: a cache a pull request could have written
# must never reach a release asset.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch: {}
  workflow_call:
    inputs:
      tag:
        description: The tag to release, v<version> of the workspace Cargo.toml
        type: string
        required: true
      dry_run:
        description: Build and check everything, publish nothing (release-rehearsal.yml)
        type: boolean
        required: false
        default: false
    # By name, never `inherit`. The secrets live only in the `release`
    # environment, and the calling job has no environment, so what the caller
    # passes here is empty by design. A job of this file that declares
    # `environment: release` gets the environment's values. Do not move the
    # secrets to the repository to "fix" the empty values.
    secrets:
      APPLE_CERTIFICATE_P12:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      APPLE_API_KEY_P8:
        required: false
      APPLE_API_KEY_ID:
        required: false
      APPLE_API_ISSUER_ID:
        required: false
      TAP_GITHUB_TOKEN:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

env:
  CARGO_TERM_COLOR: always

# Read only by default. A job that publishes names the scopes it needs in its
# own `permissions:` block, so the build jobs, which run every crate's build
# script, never hold a token that writes. The union of all blocks in this
# file must fit inside what the callers grant (contents, packages, id-token
# and attestations: write); scripts/ci/permissions-fit.sh checks it in
# workflow-lint. Never ask for `actions` here.
permissions:
  contents: read

# No workflow-level concurrency: in a call the caller's `release` job holds
# the group release-main, and a second group here could cancel a waiting
# release.

defaults:
  run:
    shell: bash

jobs:
  # Resolves the release once for every job below and stops a release whose
  # notes file is missing or has no H1 before anything is built.
  #
  # Outputs:
  # - tag: the release tag v<version>, or empty for a dispatch (dry run).
  # - name_ver: the version in every asset name, without the v: the tag's
  #   version, or 0.0.0-dev when there is no tag.
  # - publish: true when the run publishes: a call (not a dry run) or a tag
  #   push, and the run did not lose the race. publish, images, homebrew and
  #   every attest and cosign step are gated on it.
  # - build: false only when a call finds its tag already at another commit:
  #   another release of this version won the race, so this run skips
  #   everything after this job and stays green.
  # - called: true for a call. The rehearsal is a call too, so the tag
  #   creation in publish must also need publish == 'true'.
  notes:
    name: notes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      name_ver: ${{ steps.resolve.outputs.name_ver }}
      publish: ${{ steps.resolve.outputs.publish }}
      build: ${{ steps.resolve.outputs.build }}
      called: ${{ steps.resolve.outputs.called }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The run is told apart by the input and the event, never by the ref
      # type alone: a dispatch started on a tag ref has ref type tag too and
      # must not publish. inputs.tag is set only by a call; in a call
      # GITHUB_EVENT_NAME and GITHUB_REF are the caller's (push to main).
      - name: Resolve the release
        id: resolve
        env:
          INPUT_TAG: ${{ inputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          version="$(bash scripts/ci/workspace-version.sh)"
          dry=false
          [ "${DRY_RUN:-}" = true ] && dry=true
          check_tag() {
            if ! [[ "$1" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::the tag '$1' is not of the form vX.Y.Z"
              exit 1
            fi
            if [ "$1" != "v$version" ]; then
              echo "::error::the tag $1 does not match the workspace version $version at $GITHUB_SHA"
              exit 1
            fi
          }
          build=true
          if [ -n "${INPUT_TAG:-}" ]; then
            tag="$INPUT_TAG"
            called=true
            check_tag "$tag"
            # The caller checked that the tag is new, but a second push to
            # main can pass that check while the first release still runs.
            # The tag at this commit is a re-run and goes on; the tag at
            # another commit means that release won, so this one stops here.
            # The lookup prints nothing for a missing tag and fails on a
            # lookup error, which must never read as "no tag".
            found="$RUNNER_TEMP/tag-commit.txt"
            bash scripts/ci/retry.sh 3 bash -c \
              'bash scripts/release-check.sh tag-commit "$1" >"$2"' _ "$tag" "$found"
            at="$(cat "$found")"
            if [ -n "$at" ] && [ "$at" != "$GITHUB_SHA" ]; then
              if [ "$dry" = true ]; then
                echo "::notice::$tag already points at $at, not at $GITHUB_SHA; a dry run builds anyway"
              else
                echo "release: $tag already points at $at, not at $GITHUB_SHA, so another run released it; nothing to do"
                build=false
              fi
            fi
          elif [ -n "${DRY_RUN:-}" ]; then
            # inputs.dry_run is set ("true" or "false") only in a call; a
            # dispatch and a tag push leave it empty. A call with an empty
            # tag would otherwise turn into a silent dry run.
            echo "::error::release.yml was called without a tag"
            exit 1
          elif [ "$GITHUB_EVENT_NAME" = push ] && [ "$GITHUB_REF_TYPE" = tag ]; then
            tag="$GITHUB_REF_NAME"
            called=false
            check_tag "$tag"
          else
            tag=""
            called=false
            dry=true
          fi
          publish="$build"
          [ "$dry" = true ] && publish=false
          name_ver="${tag#v}"
          [ -n "$name_ver" ] || name_ver=0.0.0-dev
          echo "event $GITHUB_EVENT_NAME on $GITHUB_REF: tag '${tag}', names $name_ver, publish $publish, build $build, called $called"
          {
            echo "tag=$tag"
            echo "name_ver=$name_ver"
            echo "publish=$publish"
            echo "build=$build"
            echo "called=$called"
          } >>"$GITHUB_OUTPUT"

      # A dispatch has no tag and nothing to check. A rehearsal (dry_run)
      # runs before the release pull request adds the notes file, so a
      # missing file is only a notice there; a file that is there must be
      # right in every run.
      - name: The release notes file exists and opens with an H1
        env:
          RELEASE_TAG: ${{ steps.resolve.outputs.tag }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: |
          set -euo pipefail
          if [ -z "$RELEASE_TAG" ]; then
            echo "a dry run without a tag, nothing to verify"
            exit 0
          fi
          file="release-notes/${RELEASE_TAG}.md"
          if [ ! -s "$file" ]; then
            if [ "${DRY_RUN:-}" = true ]; then
              echo "::notice file=$file::$file is missing or empty; fine for a rehearsal, a release needs it"
              exit 0
            fi
            echo "::error file=$file::$file is missing or empty. Add it to main (a merge releases again), or push the tag again after adding it."
            exit 1
          fi
          if ! head -1 "$file" | grep -qE '^# .*[^[:space:]]'; then
            echo "::error file=$file::$file must open with an H1 (a line starting with '# ' followed by text), the release's motto."
            exit 1
          fi
          echo "release notes: $file"

  # THIRD-PARTY-NOTICES.txt in three variants (scripts/third-party-notices.sh),
  # written once here so every archive and package of a platform ships the
  # same file. Each artifact holds exactly one file, THIRD-PARTY-NOTICES.txt:
  #
  # - notices-macos: the macOS CLI archive (default features with OCR, plus
  #   the C and C++ code of llama.cpp and AWS-LC). build-macos.
  # - notices-linux: the Linux archives, the .deb packages and the image (no
  #   OCR). build-linux and images.
  # - notices-app: the app bundle resource (the app's crates, the macOS text
  #   for the notedown program inside, the npm packages in app/dist).
  #   build-macos.
  #
  # The app variant reads app/node_modules and app/dist, so npm ci and the
  # frontend build run first. No secret is in this job.
  notices:
    name: notices
    needs: notes
    if: ${{ !cancelled() && needs.notes.outputs.build == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-about reads the dependency graph through cargo metadata.
      - name: Install Rust toolchain
        run: |
          bash scripts/ci/retry.sh 3 rustup toolchain install
          rustup show active-toolchain

      # `fallback: none` fails the step rather than building or downloading
      # anything else. The second step is the same install and runs only
      # after the first one failed (a bad network day).
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: about
        continue-on-error: true
        with:
          tool: cargo-about@0.9.3
          fallback: none

      - name: Wait before the second try
        if: ${{ steps.about.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: ${{ steps.about.outcome == 'failure' }}
        with:
          tool: cargo-about@0.9.3
          fallback: none

      # No package cache: this job makes release assets.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # npm ci removes node_modules first, so a second try starts clean.
      - name: npm ci
        working-directory: app
        run: bash ../scripts/ci/retry.sh 3 npm ci

      - name: npm run build
        working-directory: app
        run: npm run build

      # No --target: the crates of every target must be in the registry for
      # cargo-about to read their license files. The app is a workspace of
      # its own with its own lock file.
      - name: Fetch crates
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 cargo fetch --locked
          bash scripts/ci/retry.sh 3 cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml

      # cargo-about can go online (a license file of a workaround), so each
      # variant retries. The script overwrites its output, so a second try
      # starts clean.
      - name: Write the notices
        run: |
          set -euo pipefail
          for variant in macos linux app; do
            mkdir -p "notices/$variant"
            bash scripts/ci/retry.sh 3 \
              bash scripts/third-party-notices.sh "$variant" "notices/$variant/THIRD-PARTY-NOTICES.txt"
          done

      # What each file must name. A license id must end a heading line
      # "<name> (<id>)": a plain "MIT" would also match "LIMITED". A crate is
      # a list line "  - <crate> <version>". The llama.cpp parts are checked
      # by lines of the copied texts, not by our own summary. The Linux file
      # must not name llama.cpp: that build has no OCR.
      - name: Check the notices
        run: |
          set -euo pipefail
          bad=0
          err() { echo "::error::$1"; bad=1; }
          has_id() {
            awk -v want=" ($2)" '
              length($0) > length(want) && substr($0, length($0) - length(want) + 1) == want { found = 1 }
              END { exit !found }
            ' "$1"
          }
          has_crate() { grep -qE -- "^  - $2 [0-9]" "$1"; }
          ggml='Copyright (c) 2023-2026 The ggml authors'
          for variant in macos linux app; do
            f="notices/$variant/THIRD-PARTY-NOTICES.txt"
            [ -s "$f" ] || { err "$f is missing or empty"; continue; }
            for id in MIT Apache-2.0; do
              has_id "$f" "$id" || err "$f has no $id license"
            done
            grep -qF 'The OpenSSL Project' "$f" || err "$f lacks the AWS-LC license file"
            case "$variant" in
              macos | linux)
                for crate in tokio rustls aws-lc-sys; do
                  has_crate "$f" "$crate" || err "$f does not list the crate $crate"
                done
                ;;
              app)
                for crate in tauri tokio; do
                  has_crate "$f" "$crate" || err "$f does not list the crate $crate"
                done
                grep -qxF 'Part 3: JavaScript and CSS packages' "$f" || err "$f has no npm part"
                for pkg in svelte tailwindcss @tauri-apps/api; do
                  grep -qE -- "^$pkg [0-9]" "$f" || err "$f does not list the npm package $pkg"
                done
                ;;
            esac
            case "$variant" in
              macos | app)
                has_crate "$f" llama-cpp-sys-2 || err "$f does not list llama-cpp-sys-2"
                for text in "$ggml" 'Copyright 2024 Mozilla Foundation' 'Copyright (c) 2017 Sean Barrett'; do
                  grep -qF -- "$text" "$f" || err "$f lacks '$text'"
                done
                ;;
              linux)
                ! has_crate "$f" llama-cpp-sys-2 || err "$f lists llama-cpp-sys-2, but the Linux build has no OCR"
                ! grep -qF -- "$ggml" "$f" || err "$f has the llama.cpp notices, but the Linux build has no OCR"
                ;;
            esac
            echo "$f: $(wc -l <"$f") lines"
          done
          exit "$bad"

      - name: Upload notices-macos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-macos
          path: notices/macos/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

      - name: Upload notices-linux
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-linux
          path: notices/linux/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

      - name: Upload notices-app
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notices-app
          path: notices/app/THIRD-PARTY-NOTICES.txt
          if-no-files-found: error

  # The Linux CLI: static musl, --no-default-features (no OCR), one leg per
  # arch on its own runner. Each leg uploads the artifact linux-<arch> with
  # three files at its root:
  #
  # - notedown-v<name_ver>-linux-<arch>.tar.gz: one top folder of the same
  #   name with exactly notedown, LICENSE, NOTICE, README.md and
  #   THIRD-PARTY-NOTICES.txt.
  # - notedown_<name_ver>_<arch>.deb
  # - notedown: the bare binary, for the image (upload-artifact does not
  #   keep the exec bit; the Dockerfile copies it with --chmod).
  build-linux:
    name: build-linux (${{ matrix.arch }})
    needs: [notes, notices]
    if: ${{ !cancelled() && needs.notes.outputs.build == 'true' && needs.notices.result == 'success' }}
    timeout-minutes: 60
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-24.04, not ubuntu-latest: the ubuntu-latest image (26.04) has no
          # Ubuntu archive in its apt sources, so musl-tools is not found there.
          - {arch: amd64, os: ubuntu-24.04, target: x86_64-unknown-linux-musl}
          - {arch: arm64, os: ubuntu-24.04-arm, target: aarch64-unknown-linux-musl}
    # The matrix and the notes outputs reach the shell steps as environment
    # variables, never as `${{ }}` text pasted into a script.
    env:
      LEG_ARCH: ${{ matrix.arch }}
      LEG_TARGET: ${{ matrix.target }}
      NAME_VER: ${{ needs.notes.outputs.name_ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          bash scripts/ci/retry.sh 3 rustup toolchain install
          rustup show active-toolchain

      - name: Add the musl target
        run: bash scripts/ci/retry.sh 3 rustup target add "$LEG_TARGET"

      # aws-lc-sys (rustls) is C and needs the musl C compiler.
      - name: Install musl-tools
        run: |
          bash scripts/ci/retry.sh 3 sudo apt-get update
          bash scripts/ci/retry.sh 3 sudo apt-get install -y musl-tools

      # cargo-auditable embeds the resolved dependency list in a section of
      # the binary (a few kB), so `cargo audit bin`, Trivy, Grype and
      # osv-scanner can name the crates inside a shipped binary or image. The
      # install action has a prebuilt binary for both runners and checks it
      # against the SHA-256 in its manifest. Two tries, as in notices.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: auditable
        continue-on-error: true
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      - name: Wait before the second try
        if: ${{ steps.auditable.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: ${{ steps.auditable.outcome == 'failure' }}
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      # The install action's cargo-deb manifest has an x86_64 Linux binary
      # only, so the arm64 leg falls back to `cargo install --locked
      # cargo-deb@3.8.0`: the same pinned version, built from crates.io.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: cargo-deb
        continue-on-error: true
        with:
          tool: cargo-deb@3.8.0
          fallback: cargo-install

      - name: Wait before the second try
        if: ${{ steps.cargo-deb.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: ${{ steps.cargo-deb.outcome == 'failure' }}
        with:
          tool: cargo-deb@3.8.0
          fallback: cargo-install

      # The network part of the build, retried. The host target too: build
      # scripts and proc macros are built for the runner, not for musl.
      # The build below is --frozen (locked and offline).
      - name: Fetch crates
        run: |
          set -euo pipefail
          host="$(rustc -vV | sed -n 's/^host: //p')"
          bash scripts/ci/retry.sh 3 cargo fetch --locked --target "$LEG_TARGET" --target "$host"

      - name: cargo auditable build --release --target musl -p notedown --no-default-features
        run: cargo auditable build --release --frozen --target "$LEG_TARGET" -p notedown --no-default-features

      # The same check as ci.yml's musl job. It compares with the workspace
      # version, never with name_ver: a dry run names its files 0.0.0-dev,
      # the binary still says the real version.
      - name: The binary is static and names the workspace version
        run: bash scripts/ci/check-linux-binary.sh "target/$LEG_TARGET/release/notedown"

      # dist/THIRD-PARTY-NOTICES.txt is where the .deb's asset list reads the
      # notices from ([package.metadata.deb] of crates/notedown).
      - name: Download notices-linux
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices-linux
          path: dist

      # The archive name is built here and only here. The archive and the
      # bare binary are copied before cargo deb runs.
      - name: Package the archive
        run: |
          set -euo pipefail
          bin="target/$LEG_TARGET/release/notedown"
          notices=dist/THIRD-PARTY-NOTICES.txt
          if [ ! -s "$notices" ]; then
            echo "::error::$notices is missing or empty (artifact notices-linux)"
            exit 1
          fi
          name="notedown-v${NAME_VER}-linux-${LEG_ARCH}"
          stage="dist/$name"
          rm -rf "$stage" out
          mkdir -p "$stage" out
          cp "$bin" LICENSE NOTICE README.md "$notices" "$stage/"
          # Owned by root in the archive, not by the runner's user, and in a
          # fixed order.
          tar -C dist --owner=0 --group=0 --numeric-owner --sort=name \
            -czf "out/$name.tar.gz" "$name"
          want="$(printf '%s\n' "$name/" "$name/LICENSE" "$name/NOTICE" "$name/README.md" \
            "$name/THIRD-PARTY-NOTICES.txt" "$name/notedown" | LC_ALL=C sort)"
          got="$(tar -tzf "out/$name.tar.gz" | LC_ALL=C sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::out/$name.tar.gz does not hold exactly the five files in $name/"
            diff -u <(echo "$want") <(echo "$got") || true
            exit 1
          fi
          cp "$bin" out/notedown
          echo "archive: out/$name.tar.gz"

      # cargo deb only reads cargo metadata --no-deps (offline). The
      # binary is target/<target>/release/notedown from the build above.
      - name: Build the .deb
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          deb="out/notedown_${NAME_VER}_${LEG_ARCH}.deb"
          cargo deb -p notedown --target "$LEG_TARGET" --no-build \
            --deb-version "$NAME_VER" --output "$deb"
          git diff --exit-code Cargo.lock
          dpkg-deb --info "$deb"
          bad=0
          got="$(dpkg-deb --field "$deb" Version)"
          [ "$got" = "$NAME_VER" ] || { echo "::error::$deb has the version '$got', want '$NAME_VER'"; bad=1; }
          got="$(dpkg-deb --field "$deb" Architecture)"
          [ "$got" = "$LEG_ARCH" ] || { echo "::error::$deb has the architecture '$got', want '$LEG_ARCH'"; bad=1; }
          dpkg-deb --contents "$deb" | awk '{print $NF}' | grep -qxF ./usr/bin/notedown \
            || { echo "::error::$deb has no ./usr/bin/notedown"; bad=1; }
          dpkg-deb --fsys-tarfile "$deb" | tar -xO ./usr/share/doc/notedown/THIRD-PARTY-NOTICES.txt \
            | cmp -s - dist/THIRD-PARTY-NOTICES.txt \
            || { echo "::error::the notices in $deb differ from notices-linux"; bad=1; }
          exit "$bad"

      - name: Upload linux-${{ matrix.arch }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  # The four CycloneDX SBOMs of the release, in the artifact `sboms`:
  #
  # - notedown-v<name_ver>-macos.cdx.json: crates/notedown with default
  #   features for aarch64-apple-darwin.
  # - notedown-v<name_ver>-linux-amd64.cdx.json and -linux-arm64.cdx.json:
  #   crates/notedown with --no-default-features for each musl target. The
  #   .deb of an arch has the same tree and uses that SBOM.
  # - notedown-app-v<name_ver>-macos.cdx.json: the app's crates, plus the
  #   notedown program inside it and its crates, plus the npm packages built
  #   into app/dist (scripts/ci/app-sbom.sh, the same npm set as the app
  #   notices).
  #
  # No secret, no write scope: the tools this job installs never get a token
  # that can write.
  sbom:
    name: sbom
    needs: notes
    if: ${{ !cancelled() && needs.notes.outputs.build == 'true' }}
    timeout-minutes: 30
    runs-on: ubuntu-latest
    env:
      NAME_VER: ${{ needs.notes.outputs.name_ver }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # cargo-cyclonedx reads the dependency graph through cargo metadata.
      - name: Install Rust toolchain
        run: |
          bash scripts/ci/retry.sh 3 rustup toolchain install
          rustup show active-toolchain

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: cyclonedx
        continue-on-error: true
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      - name: Wait before the second try
        if: ${{ steps.cyclonedx.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: ${{ steps.cyclonedx.outcome == 'failure' }}
        with:
          tool: cargo-cyclonedx@0.5.9
          fallback: none

      # No package cache: this job makes release assets.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # npm sbom reads the installed tree; nothing is built, so no install
      # scripts run.
      - name: npm ci
        working-directory: app
        run: bash ../scripts/ci/retry.sh 3 npm ci --ignore-scripts

      # No --target: the crates of every target must be in the registry.
      # cargo-cyclonedx has no --locked flag, so the fetch is locked here and
      # the runs below are offline.
      - name: Fetch crates
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 cargo fetch --locked
          bash scripts/ci/retry.sh 3 cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml

      # cargo-cyclonedx writes a file next to every workspace member's
      # Cargo.toml whatever --manifest-path says, so the one of the asked
      # crate is kept and the rest removed. The diff checks at the end prove
      # that neither lock file changed.
      - name: Generate the Rust SBOMs
        env:
          CARGO_NET_OFFLINE: 'true'
        run: |
          set -euo pipefail
          mkdir -p sbom "$RUNNER_TEMP/sbom"
          # gen <manifest> <target> <out> [cargo cyclonedx flags...]
          gen() {
            local manifest="$1" target="$2" out="$3" name
            shift 3
            name="$(basename "$out" .json)"
            cargo cyclonedx --manifest-path "$manifest" \
              --format json --spec-version 1.5 \
              --target "$target" --override-filename "$name" "$@"
            mv "$(dirname "$manifest")/$name.json" "$out"
            find . \( -path ./target -o -path ./.git -o -path ./sbom -o -path ./app/node_modules \) -prune \
              -o -type f -name "$name.json" -exec rm -f -- {} +
          }
          gen crates/notedown/Cargo.toml aarch64-apple-darwin "sbom/notedown-v${NAME_VER}-macos.cdx.json"
          gen crates/notedown/Cargo.toml x86_64-unknown-linux-musl \
            "sbom/notedown-v${NAME_VER}-linux-amd64.cdx.json" --no-default-features
          gen crates/notedown/Cargo.toml aarch64-unknown-linux-musl \
            "sbom/notedown-v${NAME_VER}-linux-arm64.cdx.json" --no-default-features
          gen app/src-tauri/Cargo.toml aarch64-apple-darwin "$RUNNER_TEMP/sbom/app-crates.cdx.json"
          git diff --exit-code Cargo.lock app/src-tauri/Cargo.lock

      # npm sbom lists every installed package, dev tools included;
      # app-sbom.sh keeps only the ones built into app/dist. The file stays
      # out of app/ (a stray file there could reach a build).
      - name: Generate the app SBOM
        run: |
          set -euo pipefail
          (cd app && npm sbom --sbom-format cyclonedx --sbom-type application) \
            >"$RUNNER_TEMP/sbom/npm.cdx.json"
          bash scripts/ci/app-sbom.sh \
            "$RUNNER_TEMP/sbom/app-crates.cdx.json" \
            "sbom/notedown-v${NAME_VER}-macos.cdx.json" \
            "$RUNNER_TEMP/sbom/npm.cdx.json" \
            app/package-lock.json app/bundled-packages.txt \
            "sbom/notedown-app-v${NAME_VER}-macos.cdx.json"

      # Cheap guards against an SBOM that is empty or describes the wrong
      # build: llama-cpp-sys-2 (OCR) is only in the macOS graphs, tauri and
      # the npm packages only in the app's.
      - name: Check the SBOMs
        run: |
          set -euo pipefail
          ls -la sbom
          want="$(printf '%s\n' "notedown-app-v${NAME_VER}-macos.cdx.json" \
            "notedown-v${NAME_VER}-linux-amd64.cdx.json" "notedown-v${NAME_VER}-linux-arm64.cdx.json" \
            "notedown-v${NAME_VER}-macos.cdx.json" | LC_ALL=C sort)"
          got="$(find sbom -type f -printf '%f\n' | LC_ALL=C sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::sbom/ does not hold exactly the four SBOMs"
            diff -u <(echo "$want") <(echo "$got") || true
            exit 1
          fi
          has() { jq -e --arg c "$2" 'any(.components[]; .name == $c)' "$1" >/dev/null; }
          bad=0
          err() { echo "::error::$1"; bad=1; }
          for f in sbom/*.cdx.json; do
            case "$f" in
              */notedown-app-*) root=notedown-app ;;
              *) root=notedown ;;
            esac
            jq -e --arg root "$root" '.bomFormat == "CycloneDX" and .specVersion == "1.5"
              and .metadata.component.name == $root and (.components | length) > 20' "$f" >/dev/null \
              || err "$f is not a CycloneDX 1.5 SBOM of $root with its crates"
            has "$f" tokio || err "$f does not list tokio"
            case "$f" in
              */notedown-app-*)
                for c in tauri llama-cpp-sys-2 notedown svelte tailwindcss @tauri-apps/api; do
                  has "$f" "$c" || err "$f does not list $c"
                done
                ;;
              *-macos.cdx.json)
                has "$f" llama-cpp-sys-2 || err "$f does not list llama-cpp-sys-2"
                ;;
              *-linux-*)
                ! has "$f" llama-cpp-sys-2 || err "$f lists llama-cpp-sys-2, but the Linux build has no OCR"
                ;;
            esac
            echo "$f: $(jq '.components | length' "$f") components"
          done
          exit "$bad"

      - name: Upload the SBOMs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: sboms
          path: sbom/*.cdx.json
          if-no-files-found: error

  # The macOS CLI and the app, Apple silicon only, minimum macOS 13.0. The
  # artifact `macos` holds four files at its root:
  #
  # - notedown-v<name_ver>-macos.tar.gz: one top folder of the same name with
  #   exactly notedown (signed and notarized, no stapled ticket: a bare
  #   binary cannot carry one), LICENSE, NOTICE, README.md and
  #   THIRD-PARTY-NOTICES.txt (notices-macos).
  # - notedown-app-v<name_ver>-macos.dmg: notarized and stapled.
  # - notedown-app-v<name_ver>-macos.app.tar.gz and its .sig: the updater
  #   files of latest.json. The .app inside is signed, notarized and stapled
  #   by Tauri and carries notices-app as THIRD-PARTY-NOTICES.txt.
  #
  # The app bundles the signed CLI as its sidecar (Contents/MacOS/notedown);
  # Tauri signs it again inside the bundle.
  #
  # Secrets (design note 12): npm ci and the frontend build run before any
  # secret or keychain exists in the job. The CLI keychain lives only inside
  # the step that signs the CLI. The API key reaches only the two notarize
  # steps and the Tauri build. Each step gets only the secrets it reads,
  # through its own env, never $GITHUB_ENV. The cleanup at the end runs
  # always.
  #
  # The job enters the release environment (and gets its secrets) only on
  # main or a v tag; in a call the ref is the caller's, refs/heads/main.
  # A dispatch on another branch gets no secret and builds everything
  # unsigned, with a throwaway updater key. A run with a tag (a release or
  # the rehearsal) must sign; a partial set of the six Apple secrets is
  # always an error.
  #
  # Time: build about 35 min, notarize steps capped at 45 and 55 min
  # (typical 5 each), tauri build capped at 60 min (typical 20), the rest
  # about 10 min. 35 + 45 + 60 + 55 + 10 = 205, so the job cap of 210 sits
  # above every step cap at its worst at once, and a slow Apple day fails
  # with the step's own error and the notary log, never the job cap.
  build-macos:
    name: build-macos
    needs: [notes, notices]
    if: ${{ !cancelled() && needs.notes.outputs.build == 'true' && needs.notices.result == 'success' }}
    timeout-minutes: 210
    runs-on: macos-latest
    # deployment: false uses the environment for its secrets and branch rule
    # without recording a deployment for every build.
    environment:
      name: ${{ (startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main') && 'release' || '' }}
      deployment: false
    env:
      NAME_VER: ${{ needs.notes.outputs.name_ver }}
      RELEASE_TAG: ${{ needs.notes.outputs.tag }}
      TARGET: aarch64-apple-darwin
      MACOSX_DEPLOYMENT_TARGET: '13.0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The bundle carries the app crate's version (tauri.conf.json has
      # none), latest.json the tag's. If they differ, the updater offers
      # every user the release they already run, again and again. It reads
      # only files of the checkout, so it runs first and fails fast.
      - name: The app version matches the tag
        if: ${{ needs.notes.outputs.tag != '' }}
        run: |
          set -euo pipefail
          app="$(awk '
            /^\[/ { inside = ($0 ~ /^\[package\][[:space:]]*$/); next }
            inside && /^version[[:space:]]*=/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
            }' app/src-tauri/Cargo.toml)"
          if [ "$app" != "${RELEASE_TAG#v}" ]; then
            echo "::error file=app/src-tauri/Cargo.toml::the app version is '$app', the tag is $RELEASE_TAG; the updater would offer this release forever"
            exit 1
          fi
          echo "app version $app matches $RELEASE_TAG"

      - name: Install Rust toolchain
        run: |
          bash scripts/ci/retry.sh 3 rustup toolchain install
          bash scripts/ci/retry.sh 3 rustup target add "$TARGET"
          rustup show active-toolchain

      # Two tries, as in notices. The install action has a prebuilt binary
      # for Apple silicon and checks it against its manifest.
      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        id: auditable
        continue-on-error: true
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      - name: Wait before the second try
        if: ${{ steps.auditable.outcome == 'failure' }}
        run: sleep 30

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        if: ${{ steps.auditable.outcome == 'failure' }}
        with:
          tool: cargo-auditable@0.7.7
          fallback: none

      # No package cache: this job makes release assets.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          package-manager-cache: false

      # Before any secret: npm install scripts and Vite plugins never run
      # next to a key or an unlocked keychain. The Tauri build below does not
      # build the frontend again (beforeBuildCommand is emptied there).
      - name: npm ci
        working-directory: app
        run: bash ../scripts/ci/retry.sh 3 npm ci

      - name: npm run build
        working-directory: app
        run: npm run build

      # The network part of both Rust builds, retried. The CLI build is
      # --frozen and the Tauri build offline, so no crate is downloaded
      # while a secret is in the environment.
      - name: Fetch crates
        run: |
          set -euo pipefail
          bash scripts/ci/retry.sh 3 cargo fetch --locked --target "$TARGET"
          bash scripts/ci/retry.sh 3 cargo fetch --locked --manifest-path app/src-tauri/Cargo.toml

      # Default features: the macOS CLI has OCR (llama.cpp with Metal).
      - name: cargo auditable build --release --target aarch64-apple-darwin -p notedown
        run: cargo auditable build --release --frozen --target "$TARGET" -p notedown

      # --version against the workspace version, never name_ver: a dry run
      # names its files 0.0.0-dev, the binary still says the real version.
      # The load command's minos is the oldest macOS the binary runs on.
      - name: The CLI names the workspace version and needs macOS 13.0
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/notedown"
          version="$(bash scripts/ci/workspace-version.sh)"
          got="$("$bin" --version)"
          echo "--version: $got"
          if [ "$got" != "notedown $version" ]; then
            echo "::error::$bin --version printed '$got', want 'notedown $version'"
            exit 1
          fi
          lipo -archs "$bin"
          [ "$(lipo -archs "$bin")" = arm64 ] || { echo "::error::$bin is not arm64 only"; exit 1; }
          minos="$(otool -l "$bin" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')"
          echo "minos: $minos"
          if [ "$minos" != 13.0 ]; then
            echo "::error::$bin needs macOS $minos, want 13.0"
            exit 1
          fi

      # A run with a tag (a release or the rehearsal) must sign, notarize
      # and sign its updater files. A run without a tag and without any of
      # the eight secrets builds unsigned with a throwaway updater key. A
      # partial set is always a mistake. Only presence is checked here.
      - name: Decide whether to sign and notarize
        id: signing
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=""
          count=0
          # Whitespace only counts as missing.
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                     APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID \
                     TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -z "$(printf '%s' "${!var:-}" | tr -d '[:space:]')" ]; then
              unset "$var"
            fi
          done
          for var in APPLE_CERTIFICATE_P12 APPLE_CERTIFICATE_PASSWORD APPLE_TEAM_ID \
                     APPLE_API_KEY_P8 APPLE_API_KEY_ID APPLE_API_ISSUER_ID; do
            if [ -z "${!var:-}" ]; then
              missing="$missing $var"
              count=$((count + 1))
            fi
          done
          if [ "$count" -eq 0 ]; then
            sign=true
          elif [ "$count" -eq 6 ] && [ -z "$RELEASE_TAG" ]; then
            echo "::notice::the Apple secrets are not here (a dry run outside main); this run builds an UNSIGNED, unnotarized CLI and app"
            sign=false
          elif [ "$count" -eq 6 ]; then
            echo "::error::the Apple secrets are not here, but $RELEASE_TAG must ship signed and notarized. Run from main or a v tag, where the release environment gives them."
            exit 1
          else
            echo "::error::Apple secrets missing:$missing. A partial set is always a mistake."
            exit 1
          fi
          if [ -n "${TAURI_SIGNING_PRIVATE_KEY:-}" ]; then
            if [ -z "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
              echo "::error::TAURI_SIGNING_PRIVATE_KEY is set but its password is not; the updater key needs both"
              exit 1
            fi
            updater=real
          elif [ -n "${TAURI_SIGNING_PRIVATE_KEY_PASSWORD:-}" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY_PASSWORD is set but the key is not; the updater key needs both"
            exit 1
          elif [ -n "$RELEASE_TAG" ]; then
            echo "::error::TAURI_SIGNING_PRIVATE_KEY is not here, but $RELEASE_TAG must ship updater files the released app can verify"
            exit 1
          else
            echo "::notice::the updater key is not here; this dry run signs the updater files with a throwaway key no released app trusts"
            updater=throwaway
          fi
          echo "sign: $sign, updater key: $updater"
          {
            echo "sign=$sign"
            echo "updater=$updater"
          } >>"$GITHUB_OUTPUT"

      # The keychain lives only inside this step: made, used and deleted
      # here (the cleanup at the end deletes it too if this step dies).
      # --force lets a retry sign a binary a failed try already signed.
      - name: Sign the CLI
        if: ${{ steps.signing.outputs.sign == 'true' }}
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          bin="target/$TARGET/release/notedown"
          identifier=io.github.jordiboehme.notedown.cli
          keychain="$RUNNER_TEMP/notedown-cli.keychain-db"
          cert="$RUNNER_TEMP/notedown-cli.p12"
          trap 'rm -f "$cert"; if [ -f "$keychain" ]; then security delete-keychain "$keychain" || true; fi' EXIT
          # A secret set from a file keeps its trailing newline: ids lose all
          # whitespace, the password its CR and LF, and both are masked again.
          team_id="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          cert_password="$(printf '%s' "$APPLE_CERTIFICATE_PASSWORD" | tr -d '\r\n')"
          echo "::add-mask::$team_id"
          echo "::add-mask::$cert_password"
          keychain_password="$(openssl rand -base64 32)"
          (umask 077 && printf '%s' "$APPLE_CERTIFICATE_P12" | base64 --decode >"$cert")
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 900 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          # The format named, as tauri-macos-sign does: security cannot infer
          # it for a p12 with PBES2/AES encryption (the OpenSSL 3 default).
          security import "$cert" -f pkcs12 -t agg -k "$keychain" -P "$cert_password" -T /usr/bin/codesign
          rm -f "$cert"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain" login.keychain-db
          identity="$(security find-identity -v -p codesigning "$keychain" \
            | awk -F'"' '/Developer ID Application/ { print $2; exit }')"
          if [ -z "$identity" ]; then
            echo "::error::no Developer ID Application identity in the signing keychain"
            exit 1
          fi
          bash scripts/ci/retry.sh 3 \
            codesign --force --timestamp --options runtime \
            --identifier "$identifier" --keychain "$keychain" --sign "$identity" "$bin"
          security delete-keychain "$keychain"
          security list-keychains -d user -s login.keychain-db
          codesign --verify --strict --verbose=2 "$bin"
          info="$(codesign --display --verbose=4 "$bin" 2>&1)"
          echo "$info"
          bad=0
          for want in "Identifier=$identifier" "TeamIdentifier=$team_id" \
                      "Authority=Developer ID Application" "(runtime)" "Timestamp="; do
            grep -qF -- "$want" <<<"$info" || { echo "::error::the CLI signature lacks '$want'"; bad=1; }
          done
          exit "$bad"

      # Worst case 43.3 min (scripts/ci/notarize.sh), cap 45.
      - name: Notarize the CLI
        if: ${{ steps.signing.outputs.sign == 'true' }}
        timeout-minutes: 45
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          zip="$RUNNER_TEMP/notedown-cli.zip"
          ditto -c -k --keepParent "target/$TARGET/release/notedown" "$zip"
          bash scripts/ci/notarize.sh "$zip"
          rm -f "$zip"

      # The hardened runtime must not break the program.
      - name: Smoke test the signed CLI
        if: ${{ steps.signing.outputs.sign == 'true' }}
        run: |
          set -euo pipefail
          "target/$TARGET/release/notedown" --version
          "target/$TARGET/release/notedown" --help >/dev/null

      - name: Download notices-macos
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices-macos
          path: dist/notices-macos

      # The archive name is built here and only here. bsdtar: COPYFILE_DISABLE
      # and --no-mac-metadata keep the ._* AppleDouble entries out,
      # --no-xattrs the extended attributes; the files are owned by root and
      # listed in a fixed order.
      - name: Package the CLI archive
        env:
          COPYFILE_DISABLE: '1'
        run: |
          set -euo pipefail
          notices=dist/notices-macos/THIRD-PARTY-NOTICES.txt
          if [ ! -s "$notices" ]; then
            echo "::error::$notices is missing or empty (artifact notices-macos)"
            exit 1
          fi
          name="notedown-v${NAME_VER}-macos"
          stage="dist/$name"
          rm -rf "$stage" out
          mkdir -p "$stage" out
          cp "target/$TARGET/release/notedown" LICENSE NOTICE README.md "$notices" "$stage/"
          # -n: no recursion, the folder and its five files in this order.
          tar -C dist --no-mac-metadata --no-xattrs --uid 0 --gid 0 --uname root --gname wheel \
            -n -czf "out/$name.tar.gz" "$name" "$name/LICENSE" "$name/NOTICE" "$name/README.md" \
            "$name/THIRD-PARTY-NOTICES.txt" "$name/notedown"
          want="$(printf '%s\n' "$name/" "$name/LICENSE" "$name/NOTICE" "$name/README.md" \
            "$name/THIRD-PARTY-NOTICES.txt" "$name/notedown" | LC_ALL=C sort)"
          got="$(tar -tzf "out/$name.tar.gz" | LC_ALL=C sort)"
          if [ "$got" != "$want" ]; then
            echo "::error::out/$name.tar.gz does not hold exactly the five files in $name/"
            diff -u <(echo "$want") <(echo "$got") || true
            exit 1
          fi
          tar -tvzf "out/$name.tar.gz"

      # The sidecar is the signed CLI from above; tauri.conf.json's
      # externalBin wants it as binaries/notedown-<target>. The bundle
      # resource is notices-app (the app's crates, the macOS text for the
      # program inside, the npm packages in app/dist), not the placeholder
      # of a local build.
      - name: Download notices-app
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: notices-app
          path: app/src-tauri/resources

      - name: Put the sidecar and the notices in place
        run: |
          set -euo pipefail
          notices=app/src-tauri/resources/THIRD-PARTY-NOTICES.txt
          if [ ! -s "$notices" ]; then
            echo "::error::$notices is missing or empty (artifact notices-app)"
            exit 1
          fi
          mkdir -p app/src-tauri/binaries
          cp "target/$TARGET/release/notedown" "app/src-tauri/binaries/notedown-$TARGET"
          chmod 755 "app/src-tauri/binaries/notedown-$TARGET"

      # Tauri signs the .app and the sidecar inside it under the hardened
      # runtime, notarizes the .app and staples it, then makes the DMG and
      # the updater files (.app.tar.gz from the stapled .app, and its .sig).
      #
      # Tauri signs when APPLE_CERTIFICATE exists, even empty, so absent must
      # mean absent: the secrets come in under other names and the script
      # exports Tauri's names only when signing. Tauri imports the p12 into a
      # keychain of its own and finds the identity there (no
      # APPLE_SIGNING_IDENTITY). Tauri decodes APPLE_CERTIFICATE strictly, so
      # its whitespace goes; the changed value is masked again.
      #
      # The updater key passes verbatim: it can be the two-line minisign
      # file, and flattening it makes Tauri report "Missing encoded key in
      # secret key". Ids lose all whitespace and passwords their CR and LF
      # (a secret set from a file keeps its trailing newline), and the
      # changed values are masked again. The throwaway key of a dry run has
      # no password, so its (empty) password variable is set too.
      #
      # beforeBuildCommand is emptied (the frontend was built above, before
      # any secret) and cargo runs offline (the crates were fetched above).
      - name: tauri build
        timeout-minutes: 60
        working-directory: app
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          UPDATER: ${{ steps.signing.outputs.updater }}
          CARGO_NET_OFFLINE: 'true'
          IN_APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          IN_APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          IN_APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IN_APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          IN_APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          IN_APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          IN_TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/tauri.XXXXXX")"
          trap 'rm -rf "$work"' EXIT
          mask() { if [ -n "$1" ]; then echo "::add-mask::$1"; fi; }
          mask_lines() { while IFS= read -r line; do mask "$line"; done <<<"$1"; }

          case "$UPDATER" in
            real)
              updater_key="$IN_TAURI_SIGNING_PRIVATE_KEY"
              updater_password="$(printf '%s' "$IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD" | tr -d '\r\n')"
              mask "$updater_password"
              ;;
            throwaway)
              ./node_modules/.bin/tauri signer generate -w "$work/updater.key" --ci >/dev/null
              updater_key="$(cat "$work/updater.key")"
              updater_password=""
              ;;
            *)
              echo "::error::unknown updater key mode '$UPDATER'"
              exit 1
              ;;
          esac
          mask_lines "$updater_key"

          if [ "$SIGN" = true ]; then
            oneline() { printf '%s' "$1" | tr -d '[:space:]'; }
            certificate="$(oneline "$IN_APPLE_CERTIFICATE_P12")"
            cert_password="$(printf '%s' "$IN_APPLE_CERTIFICATE_PASSWORD" | tr -d '\r\n')"
            team_id="$(oneline "$IN_APPLE_TEAM_ID")"
            key_id="$(oneline "$IN_APPLE_API_KEY_ID")"
            issuer="$(oneline "$IN_APPLE_API_ISSUER_ID")"
            for value in "$certificate" "$cert_password" "$team_id" "$key_id" "$issuer"; do
              mask "$value"
            done
            (umask 077 && printf '%s\n' "$IN_APPLE_API_KEY_P8" >"$work/api-key.p8")
            export APPLE_CERTIFICATE="$certificate"
            export APPLE_CERTIFICATE_PASSWORD="$cert_password"
            export APPLE_TEAM_ID="$team_id"
            export APPLE_API_KEY="$key_id"
            export APPLE_API_ISSUER="$issuer"
            export APPLE_API_KEY_PATH="$work/api-key.p8"
          fi
          export TAURI_SIGNING_PRIVATE_KEY="$updater_key"
          export TAURI_SIGNING_PRIVATE_KEY_PASSWORD="$updater_password"
          unset IN_APPLE_CERTIFICATE_P12 IN_APPLE_CERTIFICATE_PASSWORD IN_APPLE_TEAM_ID \
            IN_APPLE_API_KEY_P8 IN_APPLE_API_KEY_ID IN_APPLE_API_ISSUER_ID \
            IN_TAURI_SIGNING_PRIVATE_KEY IN_TAURI_SIGNING_PRIVATE_KEY_PASSWORD

          ./node_modules/.bin/tauri build --target "$TARGET" --bundles app,dmg \
            --config '{"build":{"beforeBuildCommand":""}}' -- --locked

      # The bundler names its files after the product and version; the
      # release uses its own names. Exactly one match each: a missing .sig
      # is a hole in latest.json, and an app that can never update again.
      - name: Stage the app files
        id: stage
        run: |
          set -euo pipefail
          bundle="app/src-tauri/target/$TARGET/release/bundle"
          base="notedown-app-v${NAME_VER}-macos"
          take() {
            local pattern="$1" dest="$2" found
            found="$(find "$bundle" -type f -name "$pattern")"
            if [ -z "$found" ] || [ "$(printf '%s\n' "$found" | wc -l)" -ne 1 ]; then
              echo "::error::want exactly one file '$pattern' under $bundle, found: ${found:-none}"
              exit 1
            fi
            cp "$found" "out/$dest"
          }
          take '*.dmg' "$base.dmg"
          take '*.app.tar.gz' "$base.app.tar.gz"
          take '*.app.tar.gz.sig' "$base.app.tar.gz.sig"
          ls -la out
          echo "dmg=out/$base.dmg" >>"$GITHUB_OUTPUT"

      # The released app trusts only plugins.updater.pubkey. A .sig made by
      # another key passes every other check and strands every installed
      # app, so the key ids must match. The throwaway key of a dry run never
      # matches and is not checked.
      - name: The updater key belongs to the app's public key
        if: ${{ steps.signing.outputs.updater == 'real' }}
        env:
          SIG: out/notedown-app-v${{ needs.notes.outputs.name_ver }}-macos.app.tar.gz.sig
        run: bash scripts/ci/updater-key-id.sh "$SIG" app/src-tauri/tauri.conf.json

      # Tauri notarizes the .app, not the DMG around it. Without a stapled
      # ticket Gatekeeper asks Apple on first open, or refuses offline.
      # Staple only fetches the ticket, which sometimes loses its connection
      # (stapler exit 68): 5 tries, 30 s apart. Every stapler and spctl call
      # has a hard alarm. Worst case: 2600 s (scripts/ci/notarize.sh) +
      # 5 x (60 + 30 s) + 4 x 30 s + 60 s = 3230 s, 53.8 min; cap 55.
      - name: Notarize and staple the DMG
        if: ${{ steps.signing.outputs.sign == 'true' }}
        timeout-minutes: 55
        env:
          DMG: ${{ steps.stage.outputs.dmg }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          bash scripts/ci/notarize.sh "$DMG"
          for attempt in 1 2 3 4 5; do
            if perl -e 'alarm shift; exec @ARGV' 60 xcrun stapler staple "$DMG" \
              && perl -e 'alarm shift; exec @ARGV' 30 xcrun stapler validate "$DMG"; then
              break
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "::error::stapling or validating $DMG failed 5 times"
              exit 1
            fi
            echo "stapling or validating failed (try $attempt of 5), next try in 30 s"
            sleep 30
          done
          perl -e 'alarm shift; exec @ARGV' 60 spctl -a -t open --context context:primary-signature -vv "$DMG"

      # The checks run on the .app from the .app.tar.gz, the file the
      # updater installs; the DMG holds the same .app. The notices must be
      # notices-app, never the placeholder of a local build: the llama.cpp
      # line and the npm part prove it.
      - name: Check the app
        env:
          SIGN: ${{ steps.signing.outputs.sign }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          base="notedown-app-v${NAME_VER}-macos"
          bad=0
          err() { echo "::error::$1"; bad=1; }
          [ -s "out/$base.app.tar.gz.sig" ] || err "out/$base.app.tar.gz.sig is empty"
          unpacked="$RUNNER_TEMP/unpacked"
          rm -rf "$unpacked"
          mkdir -p "$unpacked"
          tar -xzf "out/$base.app.tar.gz" -C "$unpacked"
          ls -la "$unpacked"
          app="$unpacked/Notedown.app"
          if [ ! -d "$app" ]; then
            echo "::error::out/$base.app.tar.gz holds no Notedown.app"
            exit 1
          fi
          plist="$app/Contents/Info.plist"
          id="$(plutil -extract CFBundleIdentifier raw "$plist")"
          [ "$id" = io.github.jordiboehme.notedown ] || err "the app's bundle identifier is '$id'"
          short="$(plutil -extract CFBundleShortVersionString raw "$plist")"
          want="$(awk '
            /^\[/ { inside = ($0 ~ /^\[package\][[:space:]]*$/); next }
            inside && /^version[[:space:]]*=/ {
              sub(/^version[[:space:]]*=[[:space:]]*"/, ""); sub(/".*$/, ""); print; exit
            }' app/src-tauri/Cargo.toml)"
          [ "$short" = "$want" ] || err "the app says version '$short', the app crate '$want'"
          notices="$app/Contents/Resources/THIRD-PARTY-NOTICES.txt"
          grep -qF -- 'Copyright (c) 2023-2026 The ggml authors' "$notices" \
            || err "$notices lacks the llama.cpp notice (a placeholder?)"
          grep -qxF 'Part 3: JavaScript and CSS packages' "$notices" \
            || err "$notices has no npm part (not notices-app?)"
          cmp -s "$notices" app/src-tauri/resources/THIRD-PARTY-NOTICES.txt \
            || err "$notices differs from notices-app"
          lsmin="$(plutil -extract LSMinimumSystemVersion raw "$plist")"
          [ "$lsmin" = 13.0 ] || err "the app's LSMinimumSystemVersion is '$lsmin', want 13.0"
          main="$app/Contents/MacOS/$(plutil -extract CFBundleExecutable raw "$plist")"
          minos="$(otool -l "$main" | awk '/LC_BUILD_VERSION/ { found = 1 } found && $1 == "minos" { print $2; exit }')"
          [ "$minos" = 13.0 ] || err "$main needs macOS '$minos', want 13.0"
          sidecar="$app/Contents/MacOS/notedown"
          version="$(bash scripts/ci/workspace-version.sh)"
          got="$("$sidecar" --version)" || got="(failed)"
          [ "$got" = "notedown $version" ] || err "$sidecar --version printed '$got', want 'notedown $version'"
          if [ "$SIGN" != true ]; then
            echo "::notice::unsigned build: the signature, notarization and staple checks are skipped"
            exit "$bad"
          fi
          codesign --verify --deep --strict --verbose=2 "$app" || err "codesign --verify --deep --strict failed on the app"
          # Tauri signs the sidecar again, with its own identifier; the
          # identifier is printed, not checked.
          info="$(codesign --display --verbose=4 "$sidecar" 2>&1)"
          echo "$info"
          team_id="$(printf '%s' "$APPLE_TEAM_ID" | tr -d '[:space:]')"
          for w in "Authority=Developer ID Application" "TeamIdentifier=$team_id" "(runtime)" "Timestamp="; do
            grep -qF -- "$w" <<<"$info" || err "the sidecar's signature lacks '$w'"
          done
          perl -e 'alarm shift; exec @ARGV' 60 xcrun stapler validate "$app" \
            || err "the app in the .app.tar.gz carries no valid stapled ticket"
          perl -e 'alarm shift; exec @ARGV' 120 spctl -a -t exec -vv "$app" \
            || err "Gatekeeper does not accept the app"
          exit "$bad"

      - name: Upload macos
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: macos
          path: out/
          if-no-files-found: error

      # The CLI step deletes its keychain itself; this catches a step that
      # died. Tauri's own keychain is ~/Library/Keychains/<16 letters and
      # digits>.keychain-db and stays when the step is killed. The key files
      # sit in mktemp folders the steps remove; these lines catch the rest.
      - name: Delete keychains and keys
        if: ${{ always() }}
        run: |
          set -uo pipefail
          for kc in "$RUNNER_TEMP/notedown-cli.keychain-db" "$HOME"/Library/Keychains/*.keychain-db; do
            [ -f "$kc" ] || continue
            name="$(basename "$kc" .keychain-db)"
            if [ "$name" = notedown-cli ] || [[ "$name" =~ ^[A-Za-z0-9]{16}$ ]]; then
              echo "deleting $kc"
              security delete-keychain "$kc" || rm -f "$kc"
            fi
          done
          rm -rf "$RUNNER_TEMP"/notarize.* "$RUNNER_TEMP"/tauri.* \
            "$RUNNER_TEMP/notedown-cli.p12" "$RUNNER_TEMP/notedown-cli.zip"
          find "$RUNNER_TEMP" -maxdepth 2 \( -name '*.p8' -o -name '*.p12' -o -name '*.key' \) -print -delete || true

  # collect (every asset by name, SHA256SUMS, latest.json, the Homebrew
  # files) goes here. It downloads linux-amd64, linux-arm64, macos and
  # sboms.

  # publish, images and homebrew go here, each gated on
  # needs.notes.outputs.publish == 'true'.
