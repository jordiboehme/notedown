name: CI

on:
  pull_request:
  push:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

# Read only by default: every job can check out the tree and nothing more. A
# job that needs another scope names it in its own `permissions:` block.
permissions:
  contents: read

# A newer push to a pull request cancels the run it supersedes. A push to main
# keeps one group per commit and never cancels.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Decides whether the Rust jobs run. They are skipped (reported as skipped,
  # not failed) when the change touches documentation only: root-level *.md,
  # docs/**, release-notes/**, LICENSE, NOTICE, .github/*.md,
  # .github/badges/**, .github/ISSUE_TEMPLATE/** and .github/FUNDING.yml.
  #
  # Everything else counts as code, including .github/workflows/** (a
  # workflow change has to exercise itself) and markdown deeper in the tree.
  #
  # The classifier fails safe: an unknown event, a missing or zeroed base, a
  # force push, a git error or an empty file list all set code=true. A
  # failed classifier skips the Rust jobs, and ci-passed reports the failure
  # of this job itself.
  changes:
    name: changes
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.decide.outputs.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # The classifier diffs against a base commit, which the default
          # shallow clone does not have.
          fetch-depth: 0

      - name: Classify the changed paths
        id: classify
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          PUSH_FORCED: ${{ github.event.forced }}
        run: |
          # The runner starts this shell with -e. Turn it off on purpose: every
          # failure in here has to end in code=true, never in a non-zero exit.
          set +e
          set -u

          run_everything() {
            echo "changes: $1, so every job runs."
            echo "code=true" >>"$GITHUB_OUTPUT"
            exit 0
          }

          case "$EVENT_NAME" in
            pull_request)
              # Three dots: what this side added since the merge base.
              base="$PR_BASE_SHA"
              range="${base}...HEAD"
              ;;
            push)
              if [ "$PUSH_FORCED" = "true" ]; then
                run_everything "a force push leaves no usable base"
              fi
              base="$PUSH_BEFORE_SHA"
              range="${base}..HEAD"
              ;;
            *)
              run_everything "the event $EVENT_NAME has no base to compare against"
              ;;
          esac

          case "$base" in
            '')             run_everything "there is no base commit" ;;
            *[!0-9a-fA-F]*) run_everything "the base is not a commit sha ($base)" ;;
            *[!0]*)         ;;
            *)              run_everything "the base commit is all zeros (a first push or a new branch)" ;;
          esac

          if ! git cat-file -e "${base}^{commit}" 2>/dev/null; then
            run_everything "the base commit $base is not in this clone"
          fi

          # --no-renames so a file that moves shows up on both sides: a rename
          # out of code into docs must not read as a documentation change.
          if ! files=$(git diff --name-only --no-renames "$range"); then
            run_everything "git diff $range failed"
          fi
          if [ -z "$files" ]; then
            run_everything "the diff against $base is empty"
          fi

          code=false
          while IFS= read -r f; do
            [ -n "$f" ] || continue
            case "$f" in
              .github/workflows/*) verdict=code ;;
              docs/*|release-notes/*) verdict=docs ;;
              LICENSE|LICENSE.md|LICENSE.txt|NOTICE) verdict=docs ;;
              .github/badges/*|.github/ISSUE_TEMPLATE/*|.github/FUNDING.yml|.github/*.md) verdict=docs ;;
              */*)                 verdict=code ;;
              *.md)                verdict=docs ;;
              *)                   verdict=code ;;
            esac
            echo "  $verdict  $f"
            if [ "$verdict" = code ]; then
              code=true
            fi
          done <<<"$files"

          echo "code=$code" >>"$GITHUB_OUTPUT"
          echo "changes: code=$code"

      - name: Decide whether the Rust jobs run
        id: decide
        env:
          CODE: ${{ steps.classify.outputs.code }}
        run: |
          set -euo pipefail
          if [ "$CODE" = "false" ]; then
            echo "changes: documentation only, so the Rust jobs are skipped."
            echo "rust=false" >>"$GITHUB_OUTPUT"
          else
            echo "rust=true" >>"$GITHUB_OUTPUT"
          fi

  fmt:
    name: fmt
    timeout-minutes: 10
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # rust-toolchain.toml names the version and the components.
      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - name: cargo fmt --check
        run: cargo fmt --all --check

  # A cold cache builds llama.cpp from C++ first, which takes most of the
  # time on these two jobs.
  clippy:
    name: clippy (${{ matrix.os }})
    timeout-minutes: 45
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # notedown-ocr builds llama.cpp with cmake and a C++ compiler, and
      # bindgen needs libclang. On Linux it links OpenMP (libgomp). The
      # runner images already have all of it (macOS: Xcode and cmake), so
      # nothing is installed. This step only checks the Linux tools, so an
      # image change fails here with a clear message and not deep in the
      # llama.cpp build.
      - name: Check the C++ build tools
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          cmake --version | head -n 1
          c++ --version | head -n 1
          # gcc prints the bare name when it does not find the library.
          gomp="$(gcc -print-file-name=libgomp.so)"
          echo "libgomp: $gomp"
          test -e "$gomp"

      # Only main saves the cache, so a pull request cannot plant artifacts
      # that a later run on main would restore.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: clippy
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --locked: Cargo.lock is the input, and a lockfile that would need an
      # update fails the check instead of being re-resolved on the runner.
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: test (${{ matrix.os }})
    timeout-minutes: 60
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # macos-latest is Apple silicon.
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # The same check as in clippy.
      - name: Check the C++ build tools
        if: ${{ runner.os == 'Linux' }}
        run: |
          set -euo pipefail
          cmake --version | head -n 1
          c++ --version | head -n 1
          # gcc prints the bare name when it does not find the library.
          gomp="$(gcc -print-file-name=libgomp.so)"
          echo "libgomp: $gomp"
          test -e "$gomp"

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.148
          fallback: none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: test
          save-if: ${{ github.ref == 'refs/heads/main' }}

      # --no-tests=warn: a workspace whose crates have no tests yet is not an
      # error.
      - name: cargo nextest run
        run: cargo nextest run --workspace --locked --no-tests=warn

      # nextest does not run doctests.
      - name: cargo test --doc
        run: cargo test --workspace --doc --locked

  # Linux on arm64, the Raspberry Pi. This job is the spec's Pi build check:
  # the notedown binary without its `ocr` feature (no llama.cpp) is built,
  # linted and tested here, and the dependency tree must not contain OCR.
  pi:
    name: pi (arm64)
    timeout-minutes: 30
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        run: |
          rustup toolchain install
          rustup show active-toolchain

      - uses: taiki-e/install-action@cfdb7ed4ccc7c7dce37759eae89dc5674b469b39 # v2.90.3
        with:
          tool: nextest@0.9.148
          fallback: none

      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: pi
          save-if: ${{ github.ref == 'refs/heads/main' }}

      - name: cargo build -p notedown-cloud
        run: cargo build -p notedown-cloud --locked

      - name: cargo nextest run -p notedown-cloud
        run: cargo nextest run -p notedown-cloud --locked --no-tests=warn

      - name: cargo test --doc -p notedown-cloud
        run: cargo test -p notedown-cloud --doc --locked

      - name: cargo clippy -p notedown --no-default-features
        run: cargo clippy -p notedown --no-default-features --all-targets --locked -- -D warnings

      - name: cargo nextest run -p notedown --no-default-features
        run: cargo nextest run -p notedown --no-default-features --locked --no-tests=warn

      - name: cargo build --release -p notedown --no-default-features
        run: cargo build --release -p notedown --no-default-features --locked

      - name: The Pi build has no OCR in its dependency tree
        run: |
          tree="$(cargo tree --locked --target aarch64-unknown-linux-gnu -p notedown --no-default-features -e normal)"
          if printf '%s\n' "$tree" | grep -E 'llama-cpp|notedown-ocr|notedown-pipeline|notedown-convert'; then
            echo "the Pi build pulls in OCR"
            exit 1
          fi

  # Dependency audit: advisories (RustSec), licenses (the allowlist in
  # deny.toml), sources and bans. security.yml also checks advisories every
  # week, since a new advisory appears without any change here.
  cargo-deny:
    name: cargo-deny
    timeout-minutes: 15
    needs: changes
    if: ${{ needs.changes.outputs.rust == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
        with:
          # The rust-toolchain.toml pin, so the action's container does not
          # resolve a different toolchain. Dependabot does not update this
          # value: move it together with rust-toolchain.toml.
          rust-version: '1.99.0'
          # `check` without a list runs all four: advisories, bans,
          # licenses and sources.
          command: check
          arguments: --all-features --locked

  # Static checks of the workflows. actionlint catches expression, type and
  # shell errors; zizmor catches the security mistakes (template injection,
  # over-wide tokens, persisted credentials, unpinned or impostor actions).
  # zizmor fails the job inline instead of uploading SARIF, so the job needs
  # no write scope. An accepted finding is ignored with a
  # `# zizmor: ignore[...]` comment next to its line and a reason above it.
  # Runs on every change, documentation included: it needs no Rust toolchain.
  workflow-lint:
    name: workflow-lint
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint 1.7.12 (the image digest is in the action's settings.json).
      - name: actionlint
        uses: devops-actions/actionlint@ec02b36684b2f574f1d219ad0a43b082e46bf3e4 # v0.1.13

      - name: zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          version: 1.31.1
          advanced-security: false
          annotations: true

  # The one check a branch protection rule requires. It always runs and
  # passes when every job above passed or was skipped (a documentation-only
  # change). Any failure or cancellation fails
  # it. A job `if` without always() would skip this job when a need is
  # skipped, and a skipped required check is not a reliable signal.
  ci-passed:
    name: ci-passed
    timeout-minutes: 5
    needs: [changes, fmt, clippy, test, pi, cargo-deny, workflow-lint]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Every job passed or was skipped
        env:
          RESULTS: ${{ toJSON(needs.*.result) }}
          FAILED: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: |
          set -euo pipefail
          echo "ci-passed: job results $RESULTS"
          if [ "$FAILED" = "true" ]; then
            echo "::error::at least one CI job failed or was cancelled"
            exit 1
          fi
