[licenses]
# notedown itself is AGPL-3.0-or-later. The workspace crates are checked like any other crate,
# so the project license is on the list.
# Data and C/C++ code bundled inside crates is not seen by this check. llama-cpp-sys-2 builds
# llama.cpp (MIT) into the binary, and a binary release must reproduce its notice.
# CDLA-Permissive-2.0 is the license of the Mozilla root certificate data in
# webpki-root-certs (reqwest with rustls). CC0-1.0 is notify.
# Only licenses the tree uses are listed; add one (MIT-like or MPL) when a new crate needs it.
allow = [
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "MPL-2.0",
    "Unicode-3.0",
    "CC0-1.0",
    "CDLA-Permissive-2.0",
]

[bans]
multiple-versions = "warn"

[advisories]
# Advisories for crates that Cargo.toml pins exactly. The fix needs a new pin, which is a change
# of its own (Dependabot proposes it). cargo-deny warns when an id here no longer matches, so
# remove each entry when its pin moves.
ignore = [
    # zip =8.6.0. All four are in ZipArchive::extract and ZipStreamReader::extract. notedown
    # never calls them: it reads single entries and never unpacks an archive to disk.
    { id = "RUSTSEC-2026-0367", reason = "zip extract only, not called; remove when zip moves to 9" },
    { id = "RUSTSEC-2026-0368", reason = "zip extract only, not called; remove when zip moves to 9" },
    { id = "RUSTSEC-2026-0369", reason = "zip extract only, not called; remove when zip moves to 9" },
    { id = "RUSTSEC-2026-0429", reason = "zip extract only, not called; remove when zip moves to 9" },
]
